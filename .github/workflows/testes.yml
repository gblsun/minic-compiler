# Roda as suítes do scanner (etapa 1), do parser (etapa 2) e do analisador
# semântico (etapa 3) nas duas implementações, num Ubuntu com gcc e python3 —
# o mesmo tipo de ambiente em que o professor executa os scripts oficiais.
#
# Dois jobs:
# - `testes`, em duas combinações de sistema/compilador/Python (uma mais antiga,
#   uma atual), porque não sabemos a versão exata da máquina do professor;
# - `robustez`, que procura o que os testes fixos não pegam: avisos do clang,
#   erros de memória (AddressSanitizer/UBSan), divergência C × Python em
#   programas gerados, e os scripts oficiais rodando de uma pasta com espaço e
#   acento no nome, em locale C.
name: testes

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # gcc 11
            python: "3.10"
          - os: ubuntu-24.04 # gcc 13
            python: "3.12"
    runs-on: ${{ matrix.os }}
    name: testes (${{ matrix.os }}, Python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Versões
        run: gcc --version | head -1 && python3 --version

      - name: Compila o parser C como o script oficial (unidade única, sem avisos)
        run: gcc -Wall -Wextra -Werror -std=c11 parser.c -o /tmp/parser

      - name: Compila o minic.c (unidade única e arquivos separados, sem avisos)
        run: |
          gcc -Wall -Wextra -Werror minic.c -o /tmp/minic
          gcc -Wall -Wextra -Werror -std=c11 -pedantic minic.c -o /tmp/minic
          gcc -Wall -Wextra -Werror -std=c11 src/c/lexer.c src/c/ast.c src/c/parser.c \
              src/c/tabela_simbolos.c src/c/semantico.c src/c/minic_main.c -o /tmp/minic-separado

      - name: Scanner — Python
        run: python3 tests/run_tests.py

      - name: Scanner — C
        run: bash src/c/test_scanner_c.sh

      - name: Parser — suíte completa (oficiais + próprios + equivalência C × Python)
        run: python3 tests/run_parser_tests.py

      # Os scripts oficiais comparam byte a byte e sempre reprovam 9 casos por
      # defeitos do próprio pacote (ver docs/correcoes-etapa2.md, seção 7), então
      # o exit code deles não serve de critério. Conferimos o resumo: 16
      # aprovados, 25 erros de sintaxe detectados e nenhum erro de execução —
      # no locale C, em que a avaliação rodou.
      - name: Parser — scripts oficiais da disciplina (LC_ALL=C)
        env:
          LC_ALL: C
        run: |
          for impl in python c; do
            fonte=./parser.py; [ "$impl" = c ] && fonte=./parser.c
            echo "=== $impl"
            bash "ref/scripts/testar_parser_$impl.sh" ref/testes-oficiais/testes-parser-50 "$fonte" > "/tmp/oficial-$impl.txt" || true
            tail -9 "/tmp/oficial-$impl.txt"
            grep -q '^Aprovados: *16$'          "/tmp/oficial-$impl.txt"
            grep -q '^Erros sintáticos: *25$'   "/tmp/oficial-$impl.txt"
            grep -q '^Erros de execução: *0$'   "/tmp/oficial-$impl.txt"
          done

      # Os exercícios reaproveitam o lexer C (src/c/lexer.c): qualquer mudança
      # nele precisa continuar compilando e passando aqui também.
      - name: Exercícios da aula 13 (Python e C)
        run: python3 exercicios/aula13/run_tests.py

      - name: Semântico — suíte completa (oficiais + próprios + equivalência C × Python)
        run: python3 tests/run_semantic_tests.py

      - name: Semântico — scripts oficiais da AP 2
        run: |
          bash ref/scripts/testes_semanticos_py.sh ./minic.py ref/testes-oficiais/testes-semanticos-20
          bash ref/scripts/testes_semanticos_c.sh ./minic.c ref/testes-oficiais/testes-semanticos-20

  robustez:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: clang sem avisos
        run: |
          clang --version | head -1
          clang -Wall -Wextra -Werror minic.c -o /tmp/minic-clang
          clang -Wall -Wextra -Werror -std=c11 parser.c -o /tmp/parser-clang

      - name: Compila com AddressSanitizer e UBSan
        run: |
          gcc -g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined \
              -fno-sanitize-recover=all minic.c -o /tmp/minic-asan

      # Todo programa de teste do repositório (scanner, parser, semântico,
      # oficiais e próprios) passa pelo binário instrumentado. Qualquer acesso
      # inválido, vazamento ou comportamento indefinido encerra com relatório
      # do sanitizer em stderr e código de saída fora de {0, 2, 3, 4}.
      - name: Sem erro de memória nas entradas de teste
        run: |
          total=0
          while IFS= read -r -d '' arquivo; do
            total=$((total + 1))
            set +e
            /tmp/minic-asan "$arquivo" > /dev/null 2> /tmp/asan-stderr.txt
            codigo=$?
            set -e
            if grep -q "Sanitizer\|runtime error" /tmp/asan-stderr.txt || [[ ! "$codigo" =~ ^[0234]$ ]]; then
              echo "FALHA em $arquivo (exit $codigo)"; cat /tmp/asan-stderr.txt; exit 1
            fi
          done < <(find ref/testes-oficiais tests -type f \( -name '*.c' -o -name '*.mc' \) -print0 | sort -z)
          echo "$total entradas sem erro de memória"

      # 900 programas gerados: aleatórios (equivalência e robustez), bem tipados
      # (têm de ser aceitos) e com um erro injetado (têm de reportar exatamente
      # aquele erro). O lado C é o binário com sanitizers.
      - name: Teste diferencial Python × C (programas gerados, C com sanitizers)
        run: python3 tests/fuzz_semantico.py --c /tmp/minic-asan -n 900

      # O enunciado veio numa pasta "Avaliação Parcial II", com espaço e acento.
      # Aqui o repositório inteiro é copiado para um caminho assim e os scripts
      # oficiais rodam de lá, em locale C (sem UTF-8).
      - name: Scripts oficiais da AP 2 em pasta com espaço e acento, LC_ALL=C
        env:
          LC_ALL: C
        run: |
          destino="/tmp/Avaliação Parcial II/minic compiler"
          mkdir -p "$destino"
          cp -r . "$destino"
          cd "$destino"
          bash ref/scripts/testes_semanticos_py.sh minic.py "ref/testes-oficiais/testes-semanticos-20"
          bash ref/scripts/testes_semanticos_c.sh minic.c "ref/testes-oficiais/testes-semanticos-20"
